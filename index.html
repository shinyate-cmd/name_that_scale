<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音感トレーニング・10問クイズ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap');
    
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 鍵盤のアニメーションと立体感スタイル */
    .key-white {
      background: linear-gradient(to bottom, #ffffff 0%, #f3f4f6 100%);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06), inset 0 -4px 0 0 #d1d5db;
      transition: all 0.08s ease;
      cursor: pointer;
    }
    .key-white:active, .key-white.active {
      transform: translateY(3px);
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05), inset 0 -1px 0 0 #9ca3af;
      background: linear-gradient(to bottom, #e5e7eb 0%, #d1d5db 100%);
    }

    /* ロック中の鍵盤スタイル */
    .key-disabled {
      opacity: 0.5;
      cursor: not-allowed !important;
      background: linear-gradient(to bottom, #e5e7eb 0%, #d1d5db 100%) !important;
      box-shadow: none !important;
      transform: none !important;
    }

    @keyframes pulse-correct {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    @keyframes shake-incorrect {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .animate-correct {
      animation: pulse-correct 0.35s ease-in-out;
    }
    .animate-incorrect {
      animation: shake-incorrect 0.35s ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

  <header class="border-b border-slate-800 bg-slate-950/70 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-gradient-to-tr from-indigo-500 to-purple-500 p-2.5 rounded-2xl shadow-lg shadow-indigo-500/20" aria-hidden="true">
          <i class="fa-solid font-bold fa-music text-xl text-white"></i>
        </div>
        <div>
          <h1 class="font-black text-lg md:text-xl bg-gradient-to-r from-indigo-300 via-purple-300 to-white bg-clip-text text-transparent">
            音感チャレンジ 10
          </h1>
          <p class="text-xs text-slate-400 font-medium">全10問 音感クイズアプリ（1音・2音・3音メロディ対応）</p>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-4xl w-full mx-auto px-4 py-6 flex-grow flex flex-col justify-center gap-5">

    <!-- 【画面上部】音階確認用・自由演奏鍵盤エリア -->
    <div class="bg-slate-950 p-4 sm:p-5 rounded-3xl border border-slate-800 shadow-2xl relative">
      <div class="flex items-center justify-between mb-2 px-1">
        <span id="free-keyboard-title" class="text-xs font-bold text-amber-400 flex items-center gap-1.5">
          <i class="fa-solid fa-info-circle" aria-hidden="true"></i> 練習用鍵盤（いつでも自由に鳴らせます）
        </span>
        <span class="text-xs text-slate-500">余韻: 約4.5秒</span>
      </div>
      <div id="free-keyboard-container" class="relative flex justify-center w-full max-w-2xl mx-auto h-36 sm:h-40 pt-1 pb-1 select-none">
        <!-- JSで動的に自由演奏用キーが作成されます -->
      </div>
    </div>

    <!-- ゲーム操作ボタンエリア -->
    <div class="flex flex-col items-center justify-center gap-3">
      <div class="flex flex-wrap items-center justify-center gap-3 w-full">
        <button id="btn-start-next" aria-label="ゲームスタート" class="px-6 py-3.5 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold shadow-lg shadow-indigo-500/25 active:scale-95 transition flex items-center gap-2 cursor-pointer">
          <i id="btn-start-icon" class="fa-solid fa-play" aria-hidden="true"></i>
          <span id="btn-start-label">ゲームスタート (Space)</span>
        </button>

        <!-- 聞き直し・音色変更ボタン -->
        <button id="btn-change-sound" aria-label="音をもう一度聴く" disabled class="px-5 py-3.5 rounded-xl bg-amber-600/80 hover:bg-amber-500 text-amber-100 font-bold disabled:opacity-40 disabled:cursor-not-allowed active:scale-95 transition flex items-center gap-2 border border-amber-500/50 shadow-md cursor-pointer">
          <i class="fa-solid fa-shuffle" aria-hidden="true"></i>
          <span>音をもう一度聴く (音色を変更)</span>
        </button>
      </div>
    </div>

    <!-- 回答用鍵盤エリア -->
    <div class="bg-slate-950 p-4 sm:p-6 rounded-3xl border border-slate-800 shadow-2xl relative">
      <div class="flex items-center justify-between mb-3 px-1">
        <span id="answer-guide-label" class="text-xs font-bold text-slate-400">📝 音名を選択して回答してください</span>
        <span id="melody-progress-label" class="text-xs font-bold text-indigo-300"></span>
      </div>

      <div id="keyboard-container" class="relative flex justify-center w-full max-w-2xl mx-auto h-44 sm:h-52 pt-2 pb-1 select-none">
        <!-- JSで動的に回答キーが作成されます -->
      </div>
    </div>

    <!-- メインメッセージ・問題パネル -->
    <div id="feedback-card" class="bg-slate-800/60 border border-slate-700 rounded-3xl p-6 text-center flex flex-col items-center justify-center min-h-[140px] relative overflow-hidden transition-all duration-300 shadow-xl">
      <div id="mode-badge" class="px-3 py-1 rounded-full bg-slate-700/80 text-slate-300 text-xs font-bold mb-3 flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse" aria-hidden="true"></span>
        <span id="mode-text">全10問クイズチャレンジ（単音 1音）</span>
      </div>

      <div id="message-text" aria-live="polite" class="text-lg sm:text-xl font-bold text-slate-100 transition-all rounded-lg px-2 py-1">
        「スタート」を押してクイズを始めてください
      </div>

      <div id="sub-message" aria-live="polite" class="text-xs sm:text-sm text-slate-400 mt-2 min-h-[1.25rem]"></div>
    </div>

    <!-- 【画面下部】出題モード・音源選択＆獲得点数ボード -->
    <div class="flex flex-col gap-3 pt-2">
      <!-- 出題モード＆音源選択セレクトボックス -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-3 px-4 flex items-center justify-between backdrop-blur-sm shadow-md">
          <label for="select-melody-length" class="text-xs font-bold text-slate-300 flex items-center gap-1.5 cursor-pointer">
            <i class="fa-solid fa-layer-group text-purple-400" aria-hidden="true"></i> 出題モード:
          </label>
          <select id="select-melody-length" class="bg-slate-900 border border-slate-700 text-slate-200 text-xs sm:text-sm font-bold rounded-xl px-3 py-1.5 outline-none focus:border-purple-500 cursor-pointer">
            <option value="1" selected>🎵 単音 (1音)</option>
            <option value="2">🎶 2音メロディ</option>
            <option value="3">🎼 3音メロディ</option>
          </select>
        </div>

        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-3 px-4 flex items-center justify-between backdrop-blur-sm shadow-md">
          <label for="select-instrument" class="text-xs font-bold text-slate-300 flex items-center gap-1.5 cursor-pointer">
            <i class="fa-solid fa-sliders text-indigo-400" aria-hidden="true"></i> 音源（音色）設定:
          </label>
          <select id="select-instrument" class="bg-slate-900 border border-slate-700 text-slate-200 text-xs sm:text-sm font-bold rounded-xl px-3 py-1.5 outline-none focus:border-indigo-500 cursor-pointer">
            <option value="piano" selected>🎹 ピアノ風</option>
            <option value="sine">🌊 サイン波 (基本音)</option>
            <option value="organ">⛪ オルガン風</option>
            <option value="flute">🪵 フルート/木管風</option>
            <option value="bit8">👾 8bitゲーム音</option>
          </select>
        </div>
      </div>

      <!-- スコア＆進行度ボード -->
      <div class="grid grid-cols-3 gap-3">
        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-3 text-center backdrop-blur-sm shadow-md">
          <div class="text-xs font-bold text-slate-400 mb-1 flex items-center justify-center gap-1">
            <i class="fa-solid fa-list-check text-indigo-400" aria-hidden="true"></i> 進捗
          </div>
          <div id="question-counter" class="text-xl sm:text-2xl font-black text-white">0 / 10</div>
        </div>

        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-3 text-center backdrop-blur-sm shadow-md">
          <div class="text-xs font-bold text-slate-400 mb-1 flex items-center justify-center gap-1">
            <i class="fa-solid fa-trophy text-amber-400" aria-hidden="true"></i> スコア
          </div>
          <div id="score-display" class="text-xl sm:text-2xl font-black text-amber-300">0 点</div>
        </div>

        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-3 text-center backdrop-blur-sm shadow-md">
          <div class="text-xs font-bold text-slate-400 mb-1 flex items-center justify-center gap-1">
            <i class="fa-solid fa-fire text-orange-500" aria-hidden="true"></i> 連続正解
          </div>
          <div id="streak-display" class="text-xl sm:text-2xl font-black text-orange-400">0</div>
        </div>
      </div>
    </div>

  </main>

  <footer class="border-t border-slate-800/80 py-4 text-center text-xs text-slate-500">
    <p>© 音感トレーニング Web App | Web Audio API 駆動</p>
  </footer>

  <div id="result-modal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-md rounded-3xl p-6 sm:p-8 shadow-2xl text-center space-y-6 transform scale-90 transition-transform duration-300" id="result-modal-content">
      
      <div id="result-icon-container" class="w-20 h-20 mx-auto rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center text-4xl shadow-inner" aria-hidden="true">
        <i class="fa-solid fa-trophy"></i>
      </div>

      <div>
        <h2 class="text-2xl font-black text-white mb-1" id="result-title">クイズ終了！</h2>
        <p class="text-xs text-slate-400" id="result-subtitle">10問すべての回答が完了しました</p>
      </div>

      <div class="bg-slate-800/80 rounded-2xl p-4 border border-slate-700/80 grid grid-cols-2 gap-4 text-center">
        <div>
          <div class="text-xs text-slate-400 font-bold mb-1">最終スコア</div>
          <div id="final-score" class="text-3xl font-black text-amber-400">0 点</div>
        </div>
        <div>
          <div class="text-xs text-slate-400 font-bold mb-1">正解率</div>
          <div id="final-accuracy" class="text-3xl font-black text-emerald-400">0 %</div>
        </div>
      </div>

      <p id="result-comment" class="text-sm font-bold text-indigo-300 px-2"></p>

      <button id="btn-restart-game" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold shadow-lg shadow-indigo-500/30 transition active:scale-95 cursor-pointer">
        <i class="fa-solid fa-rotate-right mr-1" aria-hidden="true"></i> もう一度挑戦する
      </button>
    </div>
  </div>

  <script>
    /* ドレミ音階データ (ド〜高いド) */
    const NOTE_DATA = [
      { id: "C4",  name: "ド",      freq: 261.63 },
      { id: "D4",  name: "レ",      freq: 293.66 },
      { id: "E4",  name: "ミ",      freq: 329.63 },
      { id: "F4",  name: "ファ",    freq: 349.23 },
      { id: "G4",  name: "ソ",      freq: 392.00 },
      { id: "A4",  name: "ラ",      freq: 440.00 },
      { id: "B4",  name: "シ",      freq: 493.88 },
      { id: "C5",  name: "高いド",  freq: 523.25 }
    ];

    const INSTRUMENTS = [
      { id: 'piano', name: '🎹 ピアノ風' },
      { id: 'sine',  name: '🌊 サイン波' },
      { id: 'organ', name: '⛪ オルガン風' },
      { id: 'flute', name: '🪵 フルート風' },
      { id: 'bit8',  name: '👾 8bitゲーム音' }
    ];

    /* ゲーム状態管理 */
    const state = {
      audioCtx: null,
      currentMelody: [],       // 出題中の音列（1音 / 2音 / 3音）
      answerStepIndex: 0,      // 現在の回答位置（0始まり）
      enteredNotes: [],        // ユーザーが入力済みの音列
      isPlayingSequence: false,// メロディ再生中フラグ
      playbackTimers: [],      // 再生タイマー管理用
      questionCount: 0,
      maxQuestions: 10,
      score: 0,
      correctCount: 0,
      streak: 0,
      isAnswerWaiting: false,
      gameEnded: false,
      melodyLength: 1,         // 1: 単音, 2: 2音メロディ, 3: 3音メロディ
      selectedInstrument: 'piano'
    };

    /* Web Audio API 初期化 */
    function initAudioContext() {
      if (!state.audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        state.audioCtx = new AudioContextClass();
      }
      if (state.audioCtx.state === 'suspended') {
        state.audioCtx.resume();
      }
    }

    /* 🔊 音色ごとの音線合成（発音・余韻時間：約4.5秒） */
    function playNoteSound(freq, instrument = state.selectedInstrument, duration = 4.5) {
      initAudioContext();
      const ctx = state.audioCtx;
      if (ctx.state === 'suspended') {
        ctx.resume();
      }
      const now = ctx.currentTime;

      const masterGain = ctx.createGain();
      masterGain.connect(ctx.destination);

      if (instrument === 'sine') {
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);

        masterGain.gain.setValueAtTime(0.35, now);
        masterGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc.connect(masterGain);
        osc.start(now);
        osc.stop(now + duration);

      } else if (instrument === 'piano') {
        const partials = [
          { mult: 1, gain: 0.5 },
          { mult: 2, gain: 0.22 },
          { mult: 3, gain: 0.08 },
          { mult: 4, gain: 0.03 }
        ];

        masterGain.gain.setValueAtTime(0.45, now);
        masterGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        partials.forEach(p => {
          const osc = ctx.createOscillator();
          const pGain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq * p.mult, now);

          pGain.gain.setValueAtTime(p.gain, now);
          pGain.gain.exponentialRampToValueAtTime(0.0001, now + duration * 0.85);

          osc.connect(pGain);
          pGain.connect(masterGain);
          osc.start(now);
          osc.stop(now + duration);
        });

      } else if (instrument === 'organ') {
        const harmonics = [1, 2, 3, 4];
        masterGain.gain.setValueAtTime(0.18, now);
        masterGain.gain.linearRampToValueAtTime(0.22, now + 0.08);
        masterGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        harmonics.forEach(h => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq * h, now);
          osc.connect(gain);
          gain.connect(masterGain);
          osc.start(now);
          osc.stop(now + duration);
        });

      } else if (instrument === 'flute') {
        const osc = ctx.createOscillator();
        const filter = ctx.createBiquadFilter();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(freq * 2.5, now);

        masterGain.gain.setValueAtTime(0.01, now);
        masterGain.gain.linearRampToValueAtTime(0.35, now + 0.12);
        masterGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc.connect(filter);
        filter.connect(masterGain);
        osc.start(now);
        osc.stop(now + duration);

      } else if (instrument === 'bit8') {
        const osc = ctx.createOscillator();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, now);

        masterGain.gain.setValueAtTime(0.15, now);
        masterGain.gain.exponentialRampToValueAtTime(0.0001, now + duration * 0.9);

        osc.connect(masterGain);
        osc.start(now);
        osc.stop(now + duration);
      }
    }

    /* 予約中のメロディ再生タイマーをクリア */
    function clearPlaybackTimers() {
      state.playbackTimers.forEach(id => clearTimeout(id));
      state.playbackTimers = [];
      state.isPlayingSequence = false;
    }

    /* 🎼 音列（1音・2音・3音）を順番に再生（出題中は鍵盤を光らせない） */
    function playMelodySequence(notes, instrument = state.selectedInstrument, stepIntervalMs = 650, noteDuration = 2.5) {
      if (!notes || notes.length === 0) return;
      clearPlaybackTimers();
      state.isPlayingSequence = true;

      notes.forEach((note, idx) => {
        const timerId = setTimeout(() => {
          playNoteSound(note.freq, instrument, noteDuration);

          if (idx === notes.length - 1) {
            const endTimer = setTimeout(() => {
              state.isPlayingSequence = false;
            }, 350);
            state.playbackTimers.push(endTimer);
          }
        }, idx * stepIntervalMs);

        state.playbackTimers.push(timerId);
      });
    }

    /* ランダムなメロディ（長さ length の配列）を生成 */
    function generateMelody(length) {
      const melody = [];
      for (let i = 0; i < length; i++) {
        const randomIndex = Math.floor(Math.random() * NOTE_DATA.length);
        melody.push(NOTE_DATA[randomIndex]);
      }
      return melody;
    }

    /* 現在のモード表示を更新 */
    function updateModeBadge() {
      const modeTextEl = document.getElementById('mode-text');
      if (state.melodyLength === 1) {
        modeTextEl.textContent = "全10問クイズチャレンジ（単音 1音）";
      } else {
        modeTextEl.textContent = `全10問クイズチャレンジ（${state.melodyLength}音メロディ）`;
      }
    }

    /* 回答進捗ラベルを更新（2音・3音モード時に何音目かを明示） */
    function updateMelodyProgressLabel() {
      const progressEl = document.getElementById('melody-progress-label');
      if (!state.isAnswerWaiting || state.melodyLength <= 1) {
        progressEl.textContent = "";
        return;
      }
      const currentNum = state.answerStepIndex + 1;
      const totalNum = state.currentMelody.length;
      const enteredNames = state.enteredNotes.map(n => n.name).join(" → ");
      progressEl.textContent = `回答中: ${currentNum} / ${totalNum} 音目` + (enteredNames ? `（入力済: ${enteredNames}）` : "");
    }

    /* 🔔 正解時の効果音: 「ピコッ！ピコッ！ピコッ🎵」 (ハッキリ聞こえる3連続音) */
    function playCorrectSE() {
      initAudioContext();
      const ctx = state.audioCtx;
      if (ctx.state === 'suspended') { ctx.resume(); }
      const now = ctx.currentTime;

      const playPiko = (time, freq) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, time);

        gain.gain.setValueAtTime(0.4, time);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.15);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(time);
        osc.stop(time + 0.18);
      };

      playPiko(now, 783.99);        // ソ (G5)
      playPiko(now + 0.15, 987.77);  // シ (B5)
      playPiko(now + 0.30, 1046.50); // 高いド (C6)
    }

    /* 🚨 効果音合成: 不正解 (ブー) */
    function playWrongSE() {
      initAudioContext();
      const ctx = state.audioCtx;
      if (ctx.state === 'suspended') { ctx.resume(); }
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, now);

      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);

      osc.connect(gain);
      osc.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.5);
    }

    /* 🎺 満点ファンファーレ合成 */
    function playFanfare() {
      initAudioContext();
      const ctx = state.audioCtx;
      if (ctx.state === 'suspended') { ctx.resume(); }
      const now = ctx.currentTime;

      const notes = [
        { freq: 523.25, time: now + 0.0, dur: 0.2 },
        { freq: 659.25, time: now + 0.2, dur: 0.2 },
        { freq: 783.99, time: now + 0.4, dur: 0.2 },
        { freq: 1046.50, time: now + 0.6, dur: 0.8 }
      ];

      notes.forEach(n => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(n.freq, n.time);

        gain.gain.setValueAtTime(0.35, n.time);
        gain.gain.exponentialRampToValueAtTime(0.0001, n.time + n.dur);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(n.time);
        osc.stop(n.time + n.dur);
      });
    }

    /* 鍵盤の描画（回答用＆自由演奏用共通） */
    function renderKeyboards() {
      // 1. 回答用鍵盤
      const answerContainer = document.getElementById('keyboard-container');
      answerContainer.innerHTML = '';
      const whiteKeyWidthPercent = 100 / NOTE_DATA.length;

      NOTE_DATA.forEach((note) => {
        const keyBtn = document.createElement('button');
        keyBtn.dataset.noteId = note.id;
        keyBtn.setAttribute('aria-label', `${note.name}の音`);
        keyBtn.className = 'key-white relative flex flex-col justify-end items-center pb-3 rounded-b-xl border border-slate-300 text-slate-800 font-bold text-sm sm:text-base z-10';
        keyBtn.style.width = `${whiteKeyWidthPercent}%`;
        keyBtn.style.height = '100%';
        keyBtn.innerHTML = `<span aria-hidden="true">${note.name}</span>`;

        keyBtn.addEventListener('click', () => {
          handleKeyInput(note);
        });

        answerContainer.appendChild(keyBtn);
      });

      // 2. 自由演奏用鍵盤（画面上部）
      const freeContainer = document.getElementById('free-keyboard-container');
      freeContainer.innerHTML = '';

      NOTE_DATA.forEach((note) => {
        const keyBtn = document.createElement('button');
        keyBtn.dataset.freeNoteId = note.id;
        keyBtn.setAttribute('aria-label', `${note.name}を鳴らす`);
        keyBtn.className = 'key-white relative flex flex-col justify-end items-center pb-2 rounded-b-xl border border-slate-300 text-slate-800 font-bold text-xs sm:text-sm z-10';
        keyBtn.style.width = `${whiteKeyWidthPercent}%`;
        keyBtn.style.height = '100%';
        keyBtn.innerHTML = `<span aria-hidden="true">${note.name}</span>`;

        keyBtn.addEventListener('click', () => {
          if (state.isAnswerWaiting || state.isPlayingSequence) return;
          playNoteSound(note.freq);
          highlightFreeKey(note.id);
        });

        freeContainer.appendChild(keyBtn);
      });

      updateFreeKeyboardLockState();
    }

    function updateFreeKeyboardLockState() {
      const freeContainer = document.getElementById('free-keyboard-container');
      const titleEl = document.getElementById('free-keyboard-title');
      const buttons = freeContainer.querySelectorAll('button');

      if (state.isAnswerWaiting || state.isPlayingSequence) {
        buttons.forEach(btn => {
          btn.classList.add('key-disabled');
          btn.setAttribute('aria-disabled', 'true');
        });
        titleEl.innerHTML = `<i class="fa-solid fa-lock text-rose-400" aria-hidden="true"></i> 練習用鍵盤（クイズ回答・再生中はロック中）`;
        titleEl.className = "text-xs font-bold text-rose-400 flex items-center gap-1.5";
      } else {
        buttons.forEach(btn => {
          btn.classList.remove('key-disabled');
          btn.removeAttribute('aria-disabled');
        });
        titleEl.innerHTML = `<i class="fa-solid fa-info-circle text-amber-400" aria-hidden="true"></i> 練習用鍵盤（いつでも自由に鳴らせます）`;
        titleEl.className = "text-xs font-bold text-amber-400 flex items-center gap-1.5";
      }
    }

    function highlightKey(noteId) {
      const keyEl = document.querySelector(`[data-note-id="${noteId}"]`);
      if (keyEl) {
        keyEl.classList.add('active');
        setTimeout(() => keyEl.classList.remove('active'), 250);
      }
    }

    function highlightFreeKey(noteId) {
      const keyEl = document.querySelector(`[data-free-note-id="${noteId}"]`);
      if (keyEl) {
        keyEl.classList.add('active');
        setTimeout(() => keyEl.classList.remove('active'), 250);
      }
    }

    function nextQuestion() {
      clearPlaybackTimers();

      if (state.gameEnded) {
        resetGame();
      }

      if (state.questionCount >= state.maxQuestions) {
        endGame();
        return;
      }

      state.questionCount++;
      document.getElementById('question-counter').textContent = `${state.questionCount} / ${state.maxQuestions}`;

      state.currentMelody = generateMelody(state.melodyLength);
      state.answerStepIndex = 0;
      state.enteredNotes = [];
      state.isAnswerWaiting = true;

      updateModeBadge();
      updateFreeKeyboardLockState();
      updateMelodyProgressLabel();

      const noteDur = state.melodyLength === 1 ? 4.5 : 2.5;
      playMelodySequence(state.currentMelody, state.selectedInstrument, 650, noteDur);

      const changeBtn = document.getElementById('btn-change-sound');
      changeBtn.disabled = false;
      changeBtn.setAttribute('aria-label', '音をもう一度聴く（音色を変更）');
      
      const messageEl = document.getElementById('message-text');
      const subMessageEl = document.getElementById('sub-message');

      if (state.melodyLength === 1) {
        messageEl.textContent = "音が鳴りました！正しい音階を押してください";
      } else {
        messageEl.textContent = `${state.melodyLength}つの音が順番に鳴りました！聴いた順番通りに押してください`;
      }
      subMessageEl.textContent = "「音をもう一度聴く」ボタンで音色を変更できます";

      const card = document.getElementById('feedback-card');
      card.className = "bg-slate-800/60 border border-indigo-500/50 rounded-3xl p-6 text-center flex flex-col items-center justify-center min-h-[140px] relative overflow-hidden transition-all duration-300 shadow-xl shadow-indigo-500/10";

      document.getElementById('btn-start-label').textContent = "もう一度聴く (Space)";
      document.getElementById('btn-start-next').setAttribute('aria-label', 'もう一度聴く');
    }

    function changeAndPlaySound() {
      if (!state.isAnswerWaiting || state.gameEnded || state.currentMelody.length === 0) return;

      const otherInstruments = INSTRUMENTS.filter(inst => inst.id !== state.selectedInstrument);
      const randomInst = otherInstruments[Math.floor(Math.random() * otherInstruments.length)];
      
      state.selectedInstrument = randomInst.id;

      const selectEl = document.getElementById('select-instrument');
      if (selectEl) {
        selectEl.value = state.selectedInstrument;
      }

      const noteDur = state.melodyLength === 1 ? 4.5 : 2.5;
      playMelodySequence(state.currentMelody, state.selectedInstrument, 650, noteDur);

      const messageEl = document.getElementById('message-text');
      messageEl.textContent = `音色変更：【${randomInst.name}】で${state.melodyLength > 1 ? state.melodyLength + '音メロディを' : ''}再生中`;
    }

    function handleKeyInput(selectedNote) {
      if (!state.isAnswerWaiting || state.gameEnded || state.currentMelody.length === 0) return;

      const expectedNote = state.currentMelody[state.answerStepIndex];
      const isStepCorrect = (selectedNote.id === expectedNote.id);

      highlightKey(selectedNote.id);

      const messageEl = document.getElementById('message-text');
      const subMessageEl = document.getElementById('sub-message');
      const card = document.getElementById('feedback-card');
      const correctMelodyText = state.currentMelody.map(n => n.name).join(" → ");

      if (!isStepCorrect) {
        // 不正解：入力音を確認用に鳴らし、その時点で終了
        clearPlaybackTimers();
        playNoteSound(selectedNote.freq);
        playWrongSE();

        state.streak = 0;
        state.isAnswerWaiting = false;
        state.enteredNotes.push(selectedNote);

        const enteredText = state.enteredNotes.map(n => n.name).join(" → ");
        messageEl.textContent = `❌ 残念！ (正解は「${correctMelodyText}」でした)`;
        subMessageEl.textContent = `${state.answerStepIndex + 1}音目で間違い（押した音: ${enteredText}）`;

        card.className = "bg-rose-950/40 border border-rose-500/60 rounded-3xl p-6 text-center flex flex-col items-center justify-center min-h-[140px] relative overflow-hidden transition-all duration-300 animate-incorrect";

      } else {
        // このステップは正解
        state.enteredNotes.push(selectedNote);
        state.answerStepIndex++;

        // まだ残りの音がある場合は次の音を待つ
        if (state.answerStepIndex < state.currentMelody.length) {
          playNoteSound(selectedNote.freq, state.selectedInstrument, 1.2);
          updateMelodyProgressLabel();
          messageEl.textContent = `👍 ${state.answerStepIndex}音目OK！続けて${state.answerStepIndex + 1}音目を押してください`;
          subMessageEl.textContent = `現在入力: ${state.enteredNotes.map(n => n.name).join(" → ")}`;
          return;
        }

        // 最後まで順番通りに正解！
        clearPlaybackTimers();
        state.score += 10;
        state.correctCount++;
        state.streak++;
        state.isAnswerWaiting = false;
        playCorrectSE();

        messageEl.textContent = `⭕ 正解！ (${correctMelodyText})`;
        subMessageEl.textContent = state.melodyLength > 1
          ? `${state.melodyLength}音のメロディを順番通りに完璧に聴き取りました！`
          : "素晴らしい正解です！";

        card.className = "bg-emerald-950/40 border border-emerald-500/60 rounded-3xl p-6 text-center flex flex-col items-center justify-center min-h-[140px] relative overflow-hidden transition-all duration-300 animate-correct";
      }

      updateMelodyProgressLabel();
      updateFreeKeyboardLockState();

      const changeBtn = document.getElementById('btn-change-sound');
      changeBtn.disabled = true;
      changeBtn.setAttribute('aria-label', '音をもう一度聴く（利用不可）');
      updateScoreBoard();

      if (state.questionCount >= state.maxQuestions) {
        document.getElementById('btn-start-label').textContent = "結果を見る (Space)";
        document.getElementById('btn-start-next').setAttribute('aria-label', '結果を見る');
      } else {
        document.getElementById('btn-start-label').textContent = "次の問題へ (Space)";
        document.getElementById('btn-start-next').setAttribute('aria-label', '次の問題へ');
      }
    }

    function updateScoreBoard() {
      document.getElementById('score-display').textContent = `${state.score} 点`;
      document.getElementById('streak-display').textContent = state.streak;
    }

    function endGame() {
      clearPlaybackTimers();
      state.gameEnded = true;
      updateFreeKeyboardLockState();
      updateMelodyProgressLabel();

      const modal = document.getElementById('result-modal');
      const modalContent = document.getElementById('result-modal-content');
      const finalScoreEl = document.getElementById('final-score');
      const finalAccuracyEl = document.getElementById('final-accuracy');
      const resultCommentEl = document.getElementById('result-comment');
      const iconContainer = document.getElementById('result-icon-container');

      const accuracy = Math.round((state.correctCount / state.maxQuestions) * 100);

      finalScoreEl.textContent = `${state.score} 点`;
      finalAccuracyEl.textContent = `${accuracy} %`;

      if (accuracy === 100) {
        resultCommentEl.textContent = "パーフェクト！素晴らしい絶対音感の持ち主です！🎉";
        iconContainer.className = "w-20 h-20 mx-auto rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center text-4xl shadow-inner animate-bounce";
        playFanfare();
      } else if (accuracy >= 70) {
        resultCommentEl.textContent = "高得点です！あと一歩で全問正解！👍";
        iconContainer.className = "w-20 h-20 mx-auto rounded-full bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-4xl shadow-inner";
      } else {
        resultCommentEl.textContent = "お疲れ様でした！繰り返し練習して音感を鍛えましょう！🎵";
        iconContainer.className = "w-20 h-20 mx-auto rounded-full bg-slate-700 text-slate-300 flex items-center justify-center text-4xl shadow-inner";
      }

      modal.classList.remove('opacity-0', 'pointer-events-none');
      modalContent.classList.remove('scale-90');
      modalContent.classList.add('scale-100');
    }

    function resetGame() {
      clearPlaybackTimers();
      state.currentMelody = [];
      state.answerStepIndex = 0;
      state.enteredNotes = [];
      state.questionCount = 0;
      state.score = 0;
      state.correctCount = 0;
      state.streak = 0;
      state.gameEnded = false;
      state.isAnswerWaiting = false;

      updateModeBadge();
      updateScoreBoard();
      updateFreeKeyboardLockState();
      updateMelodyProgressLabel();
      document.getElementById('question-counter').textContent = `0 / ${state.maxQuestions}`;
      
      const messageEl = document.getElementById('message-text');
      messageEl.textContent = "「スタート」を押してクイズを始めてください";
      
      document.getElementById('sub-message').textContent = "";
      document.getElementById('btn-start-label').textContent = "ゲームスタート (Space)";
      document.getElementById('btn-start-next').setAttribute('aria-label', 'ゲームスタート');
      
      const changeBtn = document.getElementById('btn-change-sound');
      changeBtn.disabled = true;
      changeBtn.setAttribute('aria-label', '音をもう一度聴く（利用不可）');

      const card = document.getElementById('feedback-card');
      card.className = "bg-slate-800/60 border border-slate-700 rounded-3xl p-6 text-center flex flex-col items-center justify-center min-h-[140px] relative overflow-hidden transition-all duration-300 shadow-xl";

      const modal = document.getElementById('result-modal');
      const modalContent = document.getElementById('result-modal-content');
      modal.classList.add('opacity-0', 'pointer-events-none');
      modalContent.classList.remove('scale-100');
      modalContent.classList.add('scale-90');
    }

    /* イベントリスナー設定（標準のclickイベントを使用） */
    document.getElementById('btn-start-next').addEventListener('click', () => {
      if (!state.isAnswerWaiting) {
        nextQuestion();
      } else if (state.currentMelody.length > 0) {
        const noteDur = state.melodyLength === 1 ? 4.5 : 2.5;
        playMelodySequence(state.currentMelody, state.selectedInstrument, 650, noteDur);
      }
    });

    document.getElementById('btn-change-sound').addEventListener('click', () => {
      changeAndPlaySound();
    });

    document.getElementById('btn-restart-game').addEventListener('click', () => {
      resetGame();
      nextQuestion();
    });

    document.getElementById('select-melody-length').addEventListener('change', (e) => {
      state.melodyLength = parseInt(e.target.value, 10) || 1;
      resetGame();
    });

    document.getElementById('select-instrument').addEventListener('change', (e) => {
      state.selectedInstrument = e.target.value;
    });

    // キーボードショートカット (Space)
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        const modal = document.getElementById('result-modal');
        if (modal.classList.contains('pointer-events-none')) {
          e.preventDefault();
          if (!state.isAnswerWaiting) {
            nextQuestion();
          } else if (state.currentMelody.length > 0) {
            const noteDur = state.melodyLength === 1 ? 4.5 : 2.5;
            playMelodySequence(state.currentMelody, state.selectedInstrument, 650, noteDur);
          }
        }
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      renderKeyboards();
      updateModeBadge();
    });
  </script>
</body>
</html>
